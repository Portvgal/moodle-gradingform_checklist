name: Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-ci:
    name: Moodle 4.5 / PHP 8.3 / Postgres
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, zip, gd, soap, intl, mbstring, xml
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci mustache

      - name: Moodle coding standard (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpcs

      - name: PHPDoc checker (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpdoc

      - name: Grunt AMD build and Behat lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt -t amd -t gherkinlint --max-lint-warnings 0

      - name: Verify committed AMD build output
        if: ${{ !cancelled() }}
        run: git -C plugin diff --exit-code -- amd/build

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
