name: Code Quality Advisory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory:
    name: Moodle static advisory checks
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, zip, gd, soap, intl, mbstring, xml
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle test site
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Mustache lint report
        if: ${{ !cancelled() }}
        run: |
          set +e
          moodle-plugin-ci mustache
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Mustache lint advisory::Mustache lint reported existing issues. See this workflow log before making Mustache/template changes."
            echo "- Mustache lint: issues reported (exit $status)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Mustache lint: clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Moodle coding standard report
        if: ${{ !cancelled() }}
        run: |
          set +e
          moodle-plugin-ci phpcs
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Moodle coding standard advisory::PHPCS reported existing coding-standard issues. See this workflow log before broad refactors."
            echo "- Moodle coding standard: issues reported (exit $status)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Moodle coding standard: clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: PHPDoc checker report
        if: ${{ !cancelled() }}
        run: |
          set +e
          moodle-plugin-ci phpdoc
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=PHPDoc checker advisory::PHPDoc checker reported existing documentation issues. See this workflow log before documentation cleanup."
            echo "- PHPDoc checker: issues reported (exit $status)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- PHPDoc checker: clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
